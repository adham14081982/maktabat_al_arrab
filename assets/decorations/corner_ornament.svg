<!-- Islamic geometric corner ornament for antique library theme -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <g stroke="#C9A24B" stroke-width="1.5" fill="none">
    <!-- Outer frame -->
    <path d="M2 2 L38 2 L38 38 L2 38 Z" opacity="0.3"/>
    <!-- Corner arabesque -->
    <path d="M2 12 Q2 2 12 2" />
    <path d="M6 14 Q6 6 14 6" opacity="0.6"/>
    <!-- Star pattern -->
    <path d="M10 10 L12 8 L14 10 L12 12 Z" fill="#C9A24B" opacity="0.5"/>
    <!-- Geometric lines -->
    <line x1="2" y1="20" x2="8" y2="20" opacity="0.4"/>
    <line x1="20" y1="2" x2="20" y2="8" opacity="0.4"/>
  </g>
</svg>
