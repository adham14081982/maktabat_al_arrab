<!-- Ornamental divider with Islamic geometric pattern -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 20" fill="none">
  <g stroke="#C9A24B" stroke-width="1" fill="none">
    <!-- Center diamond -->
    <path d="M100 4 L106 10 L100 16 L94 10 Z" fill="#C9A24B" opacity="0.3"/>
    <!-- Left pattern -->
    <line x1="10" y1="10" x2="85" y2="10" opacity="0.5"/>
    <circle cx="85" cy="10" r="2" fill="#C9A24B" opacity="0.6"/>
    <path d="M88 10 L92 6 L92 14 Z" opacity="0.4"/>
    <!-- Right pattern -->
    <line x1="115" y1="10" x2="190" y2="10" opacity="0.5"/>
    <circle cx="115" cy="10" r="2" fill="#C9A24B" opacity="0.6"/>
    <path d="M108 10 L112 6 L112 14 Z" opacity="0.4"/>
    <!-- End dots -->
    <circle cx="10" cy="10" r="1.5" fill="#C9A24B"/>
    <circle cx="190" cy="10" r="1.5" fill="#C9A24B"/>
  </g>
</svg>
