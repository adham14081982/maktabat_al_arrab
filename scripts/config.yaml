# ─────────────────────────────────────────────────────────────────────────────
# مكتبة العرّاب — إعدادات خط المعالجة (المرحلة ب: OCR + التصحيح الآلي)
#
# كل المفاتيح هنا تُقرأ من scripts/run_all.py و scripts/ocr_book.py.
# لا تعدّل شيئًا في الكود لتغيير السلوك — عدّل هذا الملف.
# ─────────────────────────────────────────────────────────────────────────────

# ── محرك OCR ────────────────────────────────────────────────────────────────
# tesseract : المحرك الافتراضي، يعمل محليًا وبلا إنترنت (موصى به).
# paddle    : PaddleOCR إن كان مثبتًا (دقة أفضل للعربية أحيانًا، أبطأ).
# vision    : نموذج رؤية عبر API (يتطلب llm_api_key) — الأفضل جودة والأغلى.
ocr_engine: tesseract

# مسار تنفيذ Tesseract (ويندوز). اتركه فارغًا إن كان في PATH.
tesseract_cmd: "C:\\Program Files\\Tesseract-OCR\\tesseract.exe"

# مجلد ملفات اللغة. يجب أن يحتوي ara.traineddata بلا مسافات في المسار،
# لأن Tesseract لا يقبل المسارات المقتبسة داخل --tessdata-dir.
tessdata_dir: "C:/tessdata"

ocr_lang: ara
ocr_dpi: 300          # دقة تصيير الصفحة قبل OCR (300 مثالي للمسح)
ocr_psm: 6            # 6 = كتلة نصية واحدة متراصة (الأنسب لصفحات الكتب)
ocr_oem: 1            # 1 = LSTM فقط

# ── طبقة LLM الاختيارية ─────────────────────────────────────────────────────
llm_correction: false
llm_base_url: "https://api.openai.com/v1"
llm_model: "gpt-4o-mini"
llm_api_key: ""       # ضع المفتاح هنا أو في متغير البيئة ARRAB_LLM_KEY
llm_max_chars: 6000   # حد طول الصفحة المرسلة للنموذج

# ── قواعد التصحيح ───────────────────────────────────────────────────────────
# تحويل «ى» إلى «ي» في آخر الكلمة عندما تكون ياءً (طبعات مصرية كثيرة).
normalize_final_ya: true

# حواجز الأمان الآلية (بدل المراجعة اليدوية)
max_edit_ratio: 0.08      # أقصى نسبة تعديل حرفية مقبولة للصفحة
max_word_delta: 0.05      # أقصى تغيّر في عدد الكلمات
min_confidence: 45        # أقل ثقة OCR مقبولة لاعتبار النص صالحًا
min_pass_ratio: 0.90      # نسبة الصفحات الناجحة لترقية الكتاب إلى hybrid
# عتبة ثانية ألين: الصفحة المرفوضة تظهر بصورتها داخل النص، فكتاب بـ77% يبقى
# مقروءًا كنص مع بعض الصفحات المصوّرة — أفضل من إبقائه صورًا فقط.
soft_pass_ratio: 0.75
soft_min_confidence: 75

# إدماج النص الخام (قبل التصحيح) في كتاب التطبيق، ليصبح التصحيح قابلًا للإعادة
# لاحقًا دون إعادة OCR. يكلّف ~40MB في حزمة المكتبة؛ اضبطه على false لتوفيرها.
embed_raw_text: true

# ── التشغيل ─────────────────────────────────────────────────────────────────
workers: 4                # عمليات متوازية (OCR يستهلك المعالج بشدة)
resume: true              # تخطّي الكتب التي اكتمل OCR لها
